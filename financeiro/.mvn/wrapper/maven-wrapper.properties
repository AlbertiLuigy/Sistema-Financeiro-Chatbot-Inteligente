wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.1/apache-maven-3.10.1-bin.zip
spring.application.name=financeiro-chatbot

# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/financeiro_chatbot?useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Alberti2020
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração JPA / Hibernate
# Use 'update' para o Hibernate criar/atualizar as tabelas a partir das entidades
# (ou 'validate' se você já executou o script DDL exportado do Workbench)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true